name: Build Aurora UI (Poco F1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean

      - name: Set Up Environment Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Source Manifest & Sync
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "333kainvey"
          git config --global user.email "333kainvey@users.noreply.github.com"
          
          # Sync basis source ROM
          repo init -u https://github.com/crdroidandroid/android.git -b 11.0 --depth=1
          
          # Inject Local Manifest Poco F1
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/beryllium.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/xiaomi/beryllium" name="333kainvey/android_device_xiaomi_beryllium" remote="github" revision="lineage-22.1" />
            <project path="kernel/xiaomi/sdm845" name="333kainvey/android_kernel_xiaomi_sdm845" remote="github" revision="lineage-22.1" />
            <project path="vendor/xiaomi/beryllium" name="TheMuppets/proprietary_vendor_xiaomi_beryllium" remote="github" revision="lineage-22.1" />
          </manifest>
          EOF

          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Build ROM
        run: |
          cd workspace
          source build/envsetup.sh
          lunch lineage_beryllium-userdebug
          mka bacon -j$(nproc --all)
          
